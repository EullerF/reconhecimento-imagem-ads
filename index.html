<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Gerencie suas tarefas</title>
  <meta name="description" content="Aplicação de gerenciamento de tarefas pessoais com autenticação segura e painel intuitivo." />

  <!-- Open Graph -->
  <meta property="og:title" content="TaskFlow — Gerencie suas tarefas" />
  <meta property="og:description" content="Organize suas tarefas pessoais e profissionais com autenticação segura e painel intuitivo." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="TaskFlow — Gerencie suas tarefas" />
  <meta name="twitter:description" content="Organize suas tarefas pessoais e profissionais." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            surface: {
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            },
            accent: {
              DEFAULT: '#38bdf8',
              hover: '#0ea5e9',
            },
          },
          backdropBlur: {
            xs: '2px',
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out',
            'slide-up': 'slideUp 0.35s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(18px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        },
      },
    }
  </script>

  <style>
    body {
      background-color: #0f172a;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* Glassmorphism base */
    .glass {
      background: rgba(30, 41, 59, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.13);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(56, 189, 248, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* Input styling */
    .form-input {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #e2e8f0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }
    .form-input::placeholder { color: #475569; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    /* Screen transitions */
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.35s ease-out; }

    /* Task card done state */
    .task-done .task-title { text-decoration: line-through; color: #475569; }
    .task-done { opacity: 0.55; }

    /* Badge colors */
    .badge-work    { background: rgba(59, 130, 246, 0.18); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .badge-personal{ background: rgba(20, 184, 166, 0.18); color: #5eead4; border: 1px solid rgba(20,184,166,0.3); }
    .badge-studies { background: rgba(34, 197, 94, 0.18); color: #86efac; border: 1px solid rgba(34,197,94,0.3); }

    /* Glow button */
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: #0f172a;
      font-weight: 600;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .btn-primary:hover {
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.45);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }

    /* Reduced motion accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Ambient blobs: use transform instead of top/left for GPU compositing */
    .blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased">

  <!-- Ambient background blobs (transform-based, GPU friendly) -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="blob w-96 h-96 opacity-10"
         style="background: radial-gradient(circle, #0ea5e9 0%, transparent 70%); transform: translate(-10rem, -10rem);"></div>
    <div class="blob w-80 h-80 opacity-10"
         style="background: radial-gradient(circle, #6366f1 0%, transparent 70%); transform: translate(calc(100vw - 12rem), 40vh);"></div>
    <div class="blob w-72 h-72 opacity-10"
         style="background: radial-gradient(circle, #22d3ee 0%, transparent 70%); transform: translate(30vw, calc(100vh - 9rem));"></div>
  </div>

  <!-- ───────────── LOGIN SCREEN ───────────── -->
  <section id="screen-login" class="screen active" role="main">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="glass-card rounded-2xl p-8 w-full max-w-md animate-slide-up">

        <!-- Logo -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl mb-4"
               style="background: linear-gradient(135deg, #0ea5e9, #38bdf8);">
            <svg class="w-6 h-6 text-slate-900" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <h1 class="font-display text-2xl font-bold text-white">TaskFlow</h1>
          <p class="text-slate-400 text-sm mt-1">Bem-vindo de volta</p>
        </div>

        <!-- Form -->
        <form id="form-login" novalidate>
          <div class="space-y-4">

            <div>
              <label for="login-email" class="block text-sm font-medium text-slate-300 mb-1.5">E-mail</label>
              <input id="login-email" type="email" placeholder="seu@email.com"
                     class="form-input w-full px-4 py-3 rounded-xl text-sm" />
              <p id="login-email-err" class="text-red-400 text-xs mt-1.5 hidden"></p>
            </div>

            <div>
              <label for="login-password" class="block text-sm font-medium text-slate-300 mb-1.5">Senha</label>
              <input id="login-password" type="password" placeholder="••••••••"
                     class="form-input w-full px-4 py-3 rounded-xl text-sm" />
              <p id="login-password-err" class="text-red-400 text-xs mt-1.5 hidden"></p>
            </div>

            <p id="login-global-err" class="text-red-400 text-sm text-center hidden"></p>

            <button id="btn-login" type="submit"
                    class="btn-primary w-full py-3 rounded-xl text-sm mt-2">
              Entrar
            </button>
          </div>
        </form>

        <p class="text-center text-slate-400 text-sm mt-6">
          Não tem conta?
          <button id="go-register" class="text-accent hover:text-accent-hover font-medium transition-colors">
            Cadastre-se
          </button>
        </p>
      </div>
    </div>
  </section>

  <!-- ───────────── REGISTER SCREEN ───────────── -->
  <section id="screen-register" class="screen" role="main">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="glass-card rounded-2xl p-8 w-full max-w-md animate-slide-up">

        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl mb-4"
               style="background: linear-gradient(135deg, #0ea5e9, #38bdf8);">
            <svg class="w-6 h-6 text-slate-900" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3M13.5 4.5L12 3m0 0L10.5 4.5M12 3v4.5m0 9L13.5 18m-1.5 1.5L10.5 18M12 21v-4.5"/>
            </svg>
          </div>
          <!-- Only one h1 per document: register uses h2 styled identically -->
          <h2 class="font-display text-2xl font-bold text-white">Criar conta</h2>
          <p class="text-slate-400 text-sm mt-1">Comece a organizar suas tarefas</p>
        </div>

        <form id="form-register" novalidate>
          <div class="space-y-4">

            <div>
              <label for="reg-name" class="block text-sm font-medium text-slate-300 mb-1.5">Nome completo</label>
              <input id="reg-name" type="text" placeholder="Seu nome"
                     class="form-input w-full px-4 py-3 rounded-xl text-sm" />
              <p id="reg-name-err" class="text-red-400 text-xs mt-1.5 hidden"></p>
            </div>

            <div>
              <label for="reg-email" class="block text-sm font-medium text-slate-300 mb-1.5">E-mail</label>
              <input id="reg-email" type="email" placeholder="seu@email.com"
                     class="form-input w-full px-4 py-3 rounded-xl text-sm" />
              <p id="reg-email-err" class="text-red-400 text-xs mt-1.5 hidden"></p>
            </div>

            <div>
              <label for="reg-password" class="block text-sm font-medium text-slate-300 mb-1.5">Senha</label>
              <input id="reg-password" type="password" placeholder="Mínimo 6 caracteres"
                     class="form-input w-full px-4 py-3 rounded-xl text-sm" />
              <p id="reg-password-err" class="text-red-400 text-xs mt-1.5 hidden"></p>
            </div>

            <p id="reg-global-err" class="text-red-400 text-sm text-center hidden"></p>

            <button id="btn-register" type="submit"
                    class="btn-primary w-full py-3 rounded-xl text-sm mt-2">
              Criar conta
            </button>
          </div>
        </form>

        <p class="text-center text-slate-400 text-sm mt-6">
          Já tem conta?
          <button id="go-login" class="text-accent hover:text-accent-hover font-medium transition-colors">
            Fazer login
          </button>
        </p>
      </div>
    </div>
  </section>

  <!-- ───────────── DASHBOARD SCREEN ───────────── -->
  <section id="screen-dashboard" class="screen" role="main">
    <div class="min-h-screen flex flex-col">

      <!-- Header -->
      <header class="glass sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
                 style="background: linear-gradient(135deg, #0ea5e9, #38bdf8);">
              <svg class="w-4 h-4 text-slate-900" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <div>
              <p class="text-xs text-slate-400 leading-none">Bem-vindo</p>
              <p id="header-username" class="font-semibold text-white text-sm leading-snug"></p>
            </div>
          </div>

          <button id="btn-logout"
                  class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm text-slate-300
                         hover:text-red-400 hover:bg-red-400/10 transition-all duration-200 border border-transparent
                         hover:border-red-400/20">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
            </svg>
            Sair
          </button>
        </div>
      </header>

      <!-- Main content -->
      <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-8 space-y-8">

        <!-- Create task form -->
        <div class="glass-card rounded-2xl p-6 animate-slide-up">
          <h2 class="font-display text-lg font-bold text-white mb-5 flex items-center gap-2">
            <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
            Nova Tarefa
          </h2>

          <form id="form-task" novalidate>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div class="md:col-span-1">
                <label for="task-title" class="block text-sm font-medium text-slate-300 mb-1.5">Título <span class="text-red-400">*</span></label>
                <input id="task-title" type="text" placeholder="O que precisa ser feito?"
                       class="form-input w-full px-4 py-3 rounded-xl text-sm" />
                <p id="task-title-err" class="text-red-400 text-xs mt-1.5 hidden"></p>
              </div>

              <div class="md:col-span-1">
                <label for="task-type" class="block text-sm font-medium text-slate-300 mb-1.5">Tipo</label>
                <select id="task-type"
                        class="form-input w-full px-4 py-3 rounded-xl text-sm appearance-none cursor-pointer">
                  <option value="Trabalho">💼 Trabalho</option>
                  <option value="Pessoal">🙂 Pessoal</option>
                  <option value="Estudos">📚 Estudos</option>
                </select>
              </div>
            </div>

            <div class="mb-5">
              <label for="task-desc" class="block text-sm font-medium text-slate-300 mb-1.5">Descrição <span class="text-slate-500 font-normal">(opcional)</span></label>
              <textarea id="task-desc" rows="3" placeholder="Detalhes adicionais..."
                        class="form-input w-full px-4 py-3 rounded-xl text-sm resize-none"></textarea>
            </div>

            <button id="btn-add-task" type="submit"
                    class="btn-primary px-6 py-3 rounded-xl text-sm flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
              </svg>
              Adicionar Tarefa
            </button>
          </form>
        </div>

        <!-- Task list -->
        <div>
          <div class="flex items-center justify-between mb-4">
            <h2 class="font-display text-lg font-bold text-white flex items-center gap-2">
              <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/>
              </svg>
              Minhas Tarefas
            </h2>
            <span id="task-counter" class="text-xs text-slate-400 glass px-3 py-1 rounded-full"></span>
          </div>

          <div id="task-list" class="space-y-3">
            <!-- Tasks rendered by JS -->
          </div>

          <!-- Empty state -->
          <div id="task-empty" class="hidden glass-card rounded-2xl p-12 text-center animate-fade-in">
            <div class="w-16 h-16 rounded-2xl mx-auto mb-4 flex items-center justify-center"
                 style="background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.2);">
              <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12l-3-3m0 0l-3 3m3-3v6m-1.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
              </svg>
            </div>
            <p class="text-slate-400 text-sm">Nenhuma tarefa cadastrada ainda.</p>
            <p class="text-slate-600 text-xs mt-1">Adicione sua primeira tarefa acima.</p>
          </div>
        </div>

      </main>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
